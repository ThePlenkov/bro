# ship-bead — take one bead from spec to merged PR.
#
#   work → pr-gate → merge (auto: bro act wait --merge | human: gate) → cleanup
#
# Run: `bd mol pour ship-bead --var bead=bro-xxxx`
#      add `--var merge=human` to restore the human merge gate.

formula = "ship-bead"
description = "Claim a bead, work it in a linked worktree per its spec, gate the PR with bro act, merge per the merge= var (auto: bro act wait --merge — the convoy default; human: human gate), cleanup."
version = 1
type = "workflow"

[vars.bead]
description = "The bead id to ship"
required = true

[vars.merge]
description = "Merge mode: 'auto' lands the PR through bro act wait --merge (armed in-session or by a driver — the convoy/orchestration default; fixer/driver covers post-exit review rounds). 'human' pours a human merge gate instead."
required = false
default = "auto"
enum = ["auto", "human"]

[vars.draft]
description = "PR draft flag: 'auto' derives from merge — draft iff merge=human (marking ready IS the human gate event); 'true' forces --draft, 'false' forces a ready PR (e.g. automerge but eyes first)."
required = false
default = "auto"
enum = ["auto", "true", "false"]

[[steps]]
id = "work"
title = "Implement {{bead}} per its spec"
type = "agent"
description = """
Claim {{bead}}, `bro work enter {{bead}}` for a linked worktree, and implement
it per its spec file (find it via `bro spec tree` / `specs/`). For epic beads
the first task is decomposition: child beads wired by blocks deps, each with a
spec reference — then implement the ready children in order.
Rules: spec first (sdd gate), tests via `npm test` (exact CI command), commit +
push + `gh pr create` with the draft flag from draft={{draft}}: 'true' forces
--draft; 'false' forces a ready PR; 'auto' derives from merge={{merge}} (draft
iff merge=human — marking ready IS the human gate event). Never push to main.
Done when: the PR is open and pushed.
"""

[[steps]]
id = "pr-gate"
title = "Verify — bro act status until exit 0"
type = "agent"
needs = ["work"]
description = """
In the worktree, run `bro act status` until exit 0: zero open review threads,
no pending/failing CI, no pending SAST, reviewers reported. Fix inline when
correctness is at stake; defer minor findings to debt beads (bd create -l debt)
and resolve with a pointer. `bro act threads` lists what's open. Exit non-zero
= the gate holds.
"""

[[steps]]
id = "merge"
title = "Merge — bro act wait --merge"
type = "agent"
needs = ["pr-gate"]
condition = "{{merge}} == auto"
description = """
Run `bro act wait --merge --squash` from the worktree: the watcher polls the
exit gate and lands the PR the moment it settles green — in orchestration
mode the merge is covered by the act formula, not a human gate. `bro act
merge` (dispatched by wait) refuses while the gate is blocked, so this step
can only complete green. No `--cleanup` here — the following step retires
the worktree deliberately, after the bead is closed.
If it refuses because reviewers are still pending or threads arrived after
pr-gate, keep working: fix/defer threads, then merge again. Never use
`gh pr merge` and never wait for a human — the merge is yours.
"""

[[steps]]
id = "merge-human"
title = "HUMAN GATE — merge the PR"
type = "human"
needs = ["pr-gate"]
condition = "{{merge}} == human"
description = """
Gate is green — a human reviews and merges the PR. Merge is a human
decision; agents carry, humans ship.
"""

[[steps]]
id = "cleanup"
title = "Close out — worktree, branch, bead, sync"
type = "agent"
needs = ["merge", "merge-human"]
description = """
After merge: `git pull` main, `bro work leave` / `git worktree remove` the
linked worktree, delete the merged branch, `bd close {{bead}}` (and parent
epic if its children are all closed), `bd dolt push`, `bro debt collect`.
Verify with `git worktree list` and `bd ready` — nothing left dangling.

The merged branch goes with the PR — locally AND on the remote. Only when
the branch is provably the PR's: its tip is the merged head (commits landed
after the merge still carry work) and no other open PR is based on it (a
stacked PR needs its base). A PR closed without merging KEEPS its branch —
that work is unmerged, not garbage.

Order matters (git refuses to delete a checked-out branch, and `git switch`
fails when the target is checked out in another worktree):

    git worktree remove <path> && git worktree prune   # if the PR used one
    git switch <base> && git pull --ff-only           # the PR's base branch
    git branch -D "<merged-branch>"                    # tip == merged head
    git ls-remote --exit-code --heads "<head-repo>" "<merged-branch>" >/dev/null 2>&1 \
      && git push "<head-repo>" --delete "<merged-branch>"

Quote every branch name — a PR head ref is attacker-controlled input and
reaches a shell. The remote is the PR's HEAD repo: for a fork PR, `origin`
can be the base repo, and deleting there would hit an unrelated branch.
`bro act wait --merge --cleanup` already retires the linked worktree and the
local branch; the remote branch is still yours to delete — and only if it is
still there (`delete_branch_on_merge` removes it on merge, and deleting an
already-removed ref exits non-zero). Never touch another branch — another
PR or agent may own it.
"""
