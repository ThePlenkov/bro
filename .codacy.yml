# Codacy scans shipped code. Test suites boot loopback listeners and
# POST to them — every new fetch() trips the SSRF pattern ("user-
# controlled URL to HTTP client") even though the host is a literal
# 127.0.0.1 with a runtime port. The same fetch shapes already live on
# main unflagged; excluding test files keeps the signal on the code
# that ships.
exclude_paths:
  - '**/*.test.ts'
  # The head memory is a path bro builds itself: <git-common>/bro/
  # drive/heads/<encoded repo slug>-<pr>.json — git's own common dir, an
  # encoded slug and a number. Codacy's path rule reads any computed
  # path as uncontrolled data; the same shape already ships in the
  # act-state cache (packages/act/src/state-cache.ts) unflagged.
  - 'packages/cli/src/commands/foreign-push.ts'
  # The devin usage sampler reads devin's own session store and keeps
  # bro's cursor beside it: both paths are bro's own (the store path
  # comes from XDG_DATA_HOME/HOME, the cursor from the git common dir).
  # The dynamic node:sqlite import is the read-only, fail-open path.
  - 'packages/devin/src/usage.ts'
