# plugins/<client>/bro/ is generated by `npm run gen:plugins` — adapters
# are byte-copies of their sources (hooks/run.sh, plugin.json,
# packages/cli/src/opencode.ts), so copy-paste detection there measures
# the mechanism, not drift.
# packages/cli/src/pi.ts is the pi extension — a self-contained module
# (pi loads the standalone copy via jiti; a relative import cannot ship
# with it), so it re-carries the CLI-resolution ladder opencode.ts owns
# by design. Measuring that as duplication again measures the mechanism.
sonar.cpd.exclusions=plugins/**,packages/cli/src/pi.ts
