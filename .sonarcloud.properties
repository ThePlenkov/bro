# plugins/<client>/bro/ is generated by `npm run gen:plugins` — adapters
# are byte-copies of their sources (hooks/run.sh, plugin.json,
# packages/cli/src/opencode.ts), so copy-paste detection there measures
# the mechanism, not drift. The same holds for issue analysis: the
# bundles are the SOURCES re-emitted by rolldown, so every finding there
# mirrors a finding the sources already carry (and the emitter adds its
# own — `var X = class` — that no source edit can reach). Issues are
# measured where they are written: the sources.
# packages/cli/src/adapter/core.ts is the shared adapter core — a
# self-contained module (a host loads the shipped copy with no
# node_modules to resolve against), so it re-carries the CLI-resolution
# ladder opencode.ts owns by design. Measuring that as duplication again
# measures the mechanism. It is where the ladder moved to when the pi
# extension was split into adapter/core.ts + adapter/pi.ts.
# packages/cli/src/opencode-tui.ts is the same case for the opencode TUI
# module: materialized as plugins/opencode/bro/cli.ts, it ships alone and
# re-carries the ladder by contract.
sonar.exclusions=plugins/**
sonar.cpd.exclusions=plugins/**,packages/cli/src/adapter/core.ts,packages/cli/src/opencode-tui.ts
