# plugins/<client>/bro/ is generated by `npm run gen:plugins` — adapters
# are byte-copies of their sources (hooks/run.sh, plugin.json,
# packages/cli/src/opencode.ts), so copy-paste detection there measures
# the mechanism, not drift.
# packages/cli/src/adapter/core.ts is the shared adapter core — a
# self-contained module (a host loads the shipped copy with no
# node_modules to resolve against), so it re-carries the CLI-resolution
# ladder opencode.ts owns by design. Measuring that as duplication again
# measures the mechanism. It is where the ladder moved to when the pi
# extension was split into adapter/core.ts + adapter/pi.ts.
# packages/cli/src/opencode-tui.ts is the same case for the opencode TUI
# module: materialized as plugins/opencode/bro/cli.ts, it ships alone and
# re-carries the ladder by contract.
# packages/agent-plugins/<client>/src/ is the same by-design copy contract:
# every adapter ships self-contained (a host loads it with no node_modules),
# so each re-carries the adapter-core scaffold — lineage is asserted by
# adapters.test.ts, duplication there again measures the mechanism.
# packages/cli/src/commands/plugins.ts carries per-client install/uninstall
# surfaces — opencode/kilo/pi/omp each materialize the SAME bundle contract,
# so their surface blocks are structural twins by design (the client-table
# refactor already collapsed what is factored without losing the per-client
# contract). The remaining repetition is the contract, measured again.
# plugins.test.ts asserts that contract per client — the matrix repeats the
# same install/uninstall/list assertions against each client's scope dirs;
# parametrize further and the per-client coverage disappears into one loop
# that reports identically for all four. Repetition there IS the coverage.
sonar.cpd.exclusions=plugins/**,packages/cli/src/adapter/core.ts,packages/cli/src/opencode-tui.ts,packages/gitlab/src/tasks.ts,packages/agent-plugins/**,packages/cli/src/commands/plugins.ts,packages/cli/src/commands/plugins.test.ts

