name: CodeScene

# The CodeScene PR integration (the App) posts the review; this job is the
# reproducible half — the same delta analysis a developer can run locally,
# gated so a diff may not add technical debt.
#
# The bar lives in .codescene/custom-quality-gates.json (the ladder, as
# code) and .codescene/code-health-rules.json (the numeric thresholds).
# This workflow enforces the wave-1 rule: no finding the diff CAUSED
# (introduced/degraded). It never fails on pre-existing debt — that is
# what the ladder's floor rung is for.
#
# Without CS_ACCESS_TOKEN the job skips (it never blocks a PR). The token
# is a CodeScene Personal Access Token (codescene.io → Account → API
# tokens) stored as a repository secret.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codescene-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned CLI: the sha is the artifact's content hash, so the download
  # is reproducible. Bump both together (cs version → the sha in parens).
  CS_CLI_VERSION: "1.0.54"
  CS_CLI_SHA: "6a8e86c814724b2d8719909bc96e5eb36b1d7a6c"

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        run: echo "has-token=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  delta:
    needs: check-secrets
    if: needs.check-secrets.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Install the CodeScene CLI
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://downloads.codescene.io/enterprise/cli/cs-linux-amd64-${CS_CLI_SHA}.zip"
          # downloads.codescene.io 403s intermittently on cold runners —
          # retry rather than fail the PR over a CDN hiccup.
          for attempt in 1 2 3; do
            if curl -fsSL -H "Authorization: Bearer ${CS_ACCESS_TOKEN}" -o /tmp/cs.zip "$url"; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::could not download the CodeScene CLI after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          unzip -o -q /tmp/cs.zip -d /tmp/cs
          install -m 0755 /tmp/cs/cs "$HOME/.local/bin/cs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cs" version
          "$HOME/.local/bin/cs" version | grep -q "${CS_CLI_VERSION}" \
            || { echo "::error::unexpected CLI version"; exit 1; }

      - name: Delta analysis
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cs delta "origin/${{ github.base_ref }}" HEAD --output-format json > delta.json
          echo "delta report: ${{ runner.temp }}/delta.json"

      - name: Gate — no technical debt introduced by this diff
        run: node scripts/codescene-gate.ts delta.json
