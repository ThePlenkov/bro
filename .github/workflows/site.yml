name: site

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # per-ref: a PR build must never cancel an in-flight main deploy
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm
          cache-dependency-path: site/package-lock.json

      # --ignore-scripts: this workflow runs on PRs — dependencies'
      # install scripts must not execute on untrusted code
      - run: npm ci --ignore-scripts
      - run: npm run build

      - uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        if: github.ref == 'refs/heads/main'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.136.1"
          command: deploy
