name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check generated files are fresh
        run: npm run check:plugins

      - name: Check AGENTS.md config claims
        run: npm run check:docs

      - name: Build
        run: npm run build

      - name: Check embedded snapshot is fresh
        run: npm run check:embedded

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
