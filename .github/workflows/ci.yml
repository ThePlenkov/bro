name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check generated files are fresh
        run: npm run check:plugins

      - name: Check AGENTS.md config claims
        run: npm run check:docs

      - name: Build
        run: npm run build

      - name: Check embedded snapshot is fresh
        run: npm run check:embedded

      - name: Check command reference is fresh
        run: npm run check:command-docs

      - name: Check CLI contract snapshot is fresh
        run: npm run check:contract

      - name: Check config schema is fresh
        run: npm run check:config-schema

      # one task graph — typecheck tasks interleave with test tasks
      # across projects instead of serializing per target
      - name: Typecheck + Test
        run: |
          npx nx run-many -t typecheck test --exclude='skills-*,plugins-*-skills-*'
          npm run test:scripts

  # the 4.8m e2e suite is the tail of the critical path — it needs only
  # cli's dep-tree builds (dependsOn pulls them; Nx Cloud serves the rest)
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm

      - run: npm ci --no-audit --no-fund

      # build prerequisite of the npm run build script — generates the
      # plugin manifests the cli dep-tree build consumes
      - name: Generate plugin manifests
        run: node scripts/gen-plugins.ts

      - name: Test E2E
        run: npx nx run-many -t test:e2e --exclude='skills-*,plugins-*-skills-*'

      - name: Hook latency baseline
        # earlier steps may fail after the build — run anyway when the
        # dist exists so the artifact survives the run that needs it
        if: always() && hashFiles('packages/cli/dist/index.js') != ''
        run: node scripts/bench-hooks.ts --out hooks-latency.json --enforce

      - name: Upload hook latency artifact
        if: always() && hashFiles('hooks-latency.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hooks-latency
          path: hooks-latency.json
          if-no-files-found: warn

      # network-bound (npm registry) — hermetic gates report first, a
      # registry outage can never hide a cheap local failure
      - name: Check onboarding dispatches on npm latest
        run: npm run check:onboarding
