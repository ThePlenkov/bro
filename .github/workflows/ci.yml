name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check generated files are fresh
        run: npm run check:plugins

      - name: Check AGENTS.md config claims
        run: npm run check:docs

      - name: Build
        run: npm run build

      - name: Check embedded snapshot is fresh
        run: npm run check:embedded

      - name: Check command reference is fresh
        run: npm run check:command-docs

      - name: Check CLI contract snapshot is fresh
        run: npm run check:contract

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
