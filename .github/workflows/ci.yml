name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci --no-audit --no-fund

      - name: Build vendored nx plugins
        run: npm run build:nx-plugins

      - name: Check generated files are fresh
        run: npm run check:embedded && npm run check:plugins

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
