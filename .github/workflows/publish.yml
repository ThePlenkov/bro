name: Publish

# Tag-triggered npm publish via OIDC trusted publishing — no tokens.
# Setup (one-time, after first placeholder exists on npm):
#   npm trust github @broject/<pkg> --file publish.yml --repo ThePlenkov/bro
#   (repeat per published package — prepare-for-release emits them)
on:
  push:
    tags: ['v*']
  # release-tag.yml dispatches this on main with the tag as an input —
  # GITHUB_TOKEN tag pushes do not fire the push trigger above, and
  # dispatching ON the tag would run the stale tagged workflow file.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.2.0)
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "lts/*"
          check-latest: true
          # no npm cache — publish jobs must not reuse a poisoned cache
          registry-url: https://registry.npmjs.org

      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - run: npm test

      - name: Tag must match every package version
        env:
          EXPECTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for dir in core retro convoy debt drill github gitlab providers judge learn guard stack loop act pack cli; do
            p="packages/$dir/package.json"
            name=$(node -p "require('./$p').name")
            v=$(node -p "require('./$p').version")
            test "v$v" = "$EXPECTED_TAG" || { echo "$name@$v != tag $EXPECTED_TAG (lockstep broken)"; exit 1; }
          done

      # A package that has never been published has no OIDC trust config —
      # npm can't create one for a name that doesn't exist, so its first
      # publish is always the manual `prepare-for-release` bootstrap.
      # Fail fast BEFORE any package publishes: a mid-loop abort leaves a
      # half-published lockstep (core@x.y out, cli missing).
      - name: Preflight — every package must exist on npm
        run: |
          missing=""
          for dir in core retro convoy debt drill github gitlab providers judge learn guard stack loop act pack cli; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            out=$(npm view "$name" name 2>&1) && continue
            # only a real E404 means "never published" — outages, rate
            # limits and auth failures must abort, not misreport
            if ! grep -q E404 <<<"$out"; then
              echo "::error::npm view $name failed without E404: $out"
              exit 1
            fi
            missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Never published, needs manual bootstrap (placeholder + npm trust):$missing"
            echo "Run: npx nx run-many -t prepare-for-release -p <names> && npm trust github <name> --file publish.yml --repo ThePlenkov/bro"
            exit 1
          fi

      # LTS node ships npm >= 11.5.1 — OIDC trusted publishing built in.
      # Publish order follows the internal dep graph (core first, cli last)
      # so a consumer never resolves a dep that isn't on the registry yet.
      - name: Publish @broject/* packages
        run: |
          set -e
          # setup-node's registry-url writes an _authToken placeholder
          # that expands empty and makes npm skip the OIDC exchange
          # (actions/setup-node#1551). Strip it so trusted publishing
          # can kick in.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          for dir in core retro convoy debt drill github gitlab providers judge learn guard stack loop act pack cli; do
            cd "$GITHUB_WORKSPACE/packages/$dir"
            name=$(node -p "require('./package.json').name")
            v=$(node -p "require('./package.json').version")
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "$name@$v already on npm — skipping"
              continue
            fi
            # Only a confirmed E404 means "not published" — a transient
            # registry/network error must not fall through to npm publish.
            if ! npm view "$name@$v" version 2>&1 | grep -q E404; then
              echo "npm view $name failed without E404 — aborting to avoid double publish"
              exit 1
            fi
            npm publish --access public
          done
