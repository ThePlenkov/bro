name: Publish

# Tag-triggered npm publish via OIDC trusted publishing — no tokens.
# Setup (one-time, after first placeholder exists on npm):
#   npm trust github @theplenkov/bro --file publish.yml --repo ThePlenkov/bro
on:
  push:
    tags: ['v*']
  # release-tag.yml dispatches this on main with the tag as an input —
  # GITHUB_TOKEN tag pushes do not fire the push trigger above, and
  # dispatching ON the tag would run the stale tagged workflow file.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.2.0); defaults to the run ref
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "lts/*"
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build:nx-plugins
      - run: npm run build
      - run: npm test

      - name: Tag must match package version
        working-directory: packages/cli
        run: test "v$(node -p "require('./package.json').version")" = "${{ inputs.tag || github.ref_name }}" || { echo "tag ${{ inputs.tag || github.ref_name }} != package version"; exit 1; }

      # LTS node ships npm >= 11.5.1 — OIDC trusted publishing built in.
      - name: Publish @theplenkov/bro
        working-directory: packages/cli
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@theplenkov/bro@$v" version >/dev/null 2>&1; then
            echo "version $v already on npm — skipping publish"
            exit 0
          fi
          # Only a confirmed E404 means "not published" — a transient
          # registry/network error must not fall through to npm publish.
          if ! npm view "@theplenkov/bro@$v" version 2>&1 | grep -q E404; then
            echo "npm view failed without E404 — aborting to avoid double publish"
            exit 1
          fi
          # setup-node's registry-url writes an _authToken placeholder
          # that expands empty and makes npm skip the OIDC exchange
          # (actions/setup-node#1551). Strip it so trusted publishing
          # can kick in.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          npm publish --access public
