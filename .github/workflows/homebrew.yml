name: Homebrew Tap

# Bump Formula/bro.rb in ThePlenkov/homebrew-brew after a release tag.
# The formula installs the published @broject/bro tarball, so the bump is
# only correct once publish.yml has pushed the version to npm — the
# resolve step polls the registry, which IS the ordering: a human tag
# push fires this workflow in parallel with publish.yml, and
# release-tag.yml dispatches it right after the publish dispatch (same
# reasoning as publish.yml: the latest workflow file runs, the tag only
# selects the payload).
#
# The tap is a separate repo, so GITHUB_TOKEN can't write it — every step
# is gated on secrets.HOMEBREW_TAP_TOKEN. Until the secret exists the job
# warns and the formula is bumped by hand. Setup (one-time):
#   github.com/settings/personal-access-tokens → fine-grained PAT,
#   repository: ThePlenkov/homebrew-brew, permission: Contents rw
#   gh secret set HOMEBREW_TAP_TOKEN --repo ThePlenkov/bro
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to bump to (e.g. v0.2.6)
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: No tap token — formula stays manual
        if: env.TAP_TOKEN == ''
        run: |
          echo "::warning::HOMEBREW_TAP_TOKEN is not set — bump Formula/bro.rb in ThePlenkov/homebrew-brew by hand (url + sha256 for $TAG)"

      - name: Resolve npm tarball (waits out publish.yml)
        if: env.TAP_TOKEN != ''
        id: tar
        run: |
          # workflow_dispatch input is free text — pin it to a tag charset so
          # no shell metacharacters can travel downstream with it
          [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]] || { echo "::error::TAG '$TAG' does not look like a v* tag"; exit 1; }
          pkg="@broject/bro"
          # publish.yml runs npm ci + build + test + per-package publishes
          # first — poll until the version resolves (~30 min budget).
          url=""
          for i in $(seq 1 90); do
            url=$(npm view "$pkg@${TAG#v}" dist.tarball 2>/dev/null || true)
            [ -n "$url" ] && break
            sleep 20
          done
          [ -n "$url" ] || { echo "::error::$pkg@${TAG#v} not on npm after ~30min — did publish.yml fail?"; exit 1; }
          [[ "$url" =~ ^https://registry\.npmjs\.org/@broject/bro/-/bro-.+\.tgz$ ]] \
            || { echo "::error::unexpected tarball url: '$url'"; exit 1; }
          # download first, hash after — a piped curl can hand sha256sum
          # a partial stream whose digest still matches ^[0-9a-f]{64}$
          tgz=$(mktemp)
          curl --proto '=https' --tlsv1.2 -fsSL --retry 12 --retry-delay 5 --retry-all-errors -o "$tgz" "$url"
          sha=$(sha256sum "$tgz" | cut -d' ' -f1)
          rm -f "$tgz"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::unexpected sha256 for $url: '$sha'"; exit 1; }
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "sha256=$sha" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        if: env.TAP_TOKEN != ''
        with:
          repository: ThePlenkov/homebrew-brew
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump formula, push
        if: env.TAP_TOKEN != ''
        env:
          # outputs travel via env, never ${{ }} inside run — an apostrophe
          # in a dispatched tag would otherwise break out of the sed quotes
          TAR_URL: ${{ steps.tar.outputs.url }}
          TAR_SHA: ${{ steps.tar.outputs.sha256 }}
        run: |
          set -e
          f=Formula/bro.rb
          [ -f "$f" ] || { echo "::error::$f not found in ThePlenkov/homebrew-brew — layout changed?"; exit 1; }
          # refuse a downgrade: a delayed run for an older tag must not revert
          # a formula that already moved to a newer release. Version parses
          # from either url shape — npm pack (.../-/bro-<v>.tgz) or the old
          # codeload source (.../tags/v<v>.tar.gz).
          new="${TAG#v}"
          cur_url=$(sed -nE 's|^  url "([^"]+)".*|\1|p' "$f" | head -1)
          cur=""
          case "$cur_url" in
            */-/bro-*.tgz) cur=${cur_url##*/bro-}; cur=${cur%.tgz} ;;
            */v*.tar.gz)   cur=${cur_url##*/v};    cur=${cur%.tar.gz} ;;
          esac
          if [ -n "$cur" ] && [ "$cur" != "$new" ] &&
             [ "$(printf '%s\n%s\n' "$cur" "$new" | sort -V | head -1)" = "$new" ]; then
            echo "::error::$f already at $cur, newer than $new — refusing downgrade"
            exit 1
          fi
          # whole-line replaces accept either url shape (mid-migration)
          sed -i -E \
            -e "s|^  url \"[^\"]*\"|  url \"$TAR_URL\"|" \
            -e "s|^  sha256 \"[0-9a-f]{64}\"|  sha256 \"$TAR_SHA\"|" \
            "$f"
          if git diff --quiet "$f"; then
            # unchanged is only trusted when BOTH pins already match —
            # a present url with a missing/unsupported sha256 line
            # no-op's both seds and must not pass as "updated"
            grep -qF "url \"$TAR_URL\"" "$f" && grep -qF "sha256 \"$TAR_SHA\"" "$f" \
              || { echo "::error::sed no-op and $f does not pin $TAR_URL + sha — format drifted?"; exit 1; }
            echo "formula already at $TAG — nothing to push"
            exit 0
          fi
          grep -qF "url \"$TAR_URL\"" "$f" && grep -qF "sha256 \"$TAR_SHA\"" "$f" \
            || { echo "::error::post-sed mismatch in $f — format drifted?"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bro ${TAG#v}"
          git push origin main
