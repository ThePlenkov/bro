name: Tag Release

# When a release/* PR merges, packages/cli/package.json carries a
# version with no matching tag — cut v{version} on main, open the
# GitHub release, and dispatch publish.yml for the OIDC npm publish
# (a GITHUB_TOKEN tag push does NOT trigger the tag-push event, so
# publish is invoked explicitly). workflow_dispatch is the manual
# catch-up path for versions that predate this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Tag v{version}, release, dispatch publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -e
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "release tagging must run from main (got $GITHUB_REF)"
            exit 1
          fi
          v=$(node -p "require('./packages/cli/package.json').version")
          # The subject must announce THIS version — a 'release: v*'
          # subject on an unrelated merge must not tag/publish. A
          # squash merge appends ' (#N)', a merge branch tip is exact.
          release_subject() {
            case "$1" in "release: v$v"|"release: v$v "*) return 0;; esac
            return 1
          }
          subject=$(git log -1 --pretty=%s)
          # A merge commit puts 'release: v*' on the second parent — but
          # fast-forward/rebase pushes have no HEAD^2, and follow-up
          # commits move the tip off the release subject either way.
          if ! release_subject "$subject"; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] \
               && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              # Only subjects of commits this push introduced — covers
              # the second parent of a merge AND linear pushes, and
              # can't match a stale release commit deeper in history.
              subject=$(git log --format=%s HEAD --not "$BEFORE_SHA" \
                | grep -m1 "^release: v$v" || true)
            else
              # workflow_dispatch catch-up (and a push whose before-SHA
              # isn't in this clone — a forced update): the release
              # commit may sit deep in ancestry — second parent on a
              # merge, else all of HEAD.
              range="HEAD"
              git rev-parse -q --verify 'HEAD^2' >/dev/null 2>&1 && range="HEAD^2"
              subject=$(git log --format=%s "$range" 2>/dev/null \
                | grep -m1 "^release: v$v" || true)
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! release_subject "$subject"; then
            echo "not a release merge ($subject) — nothing to do"
            exit 0
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$v" -m "release: v$v"
            git push origin "v$v"
          else
            echo "tag v$v already exists"
          fi
          if ! gh release view "v$v" >/dev/null 2>&1; then
            # Release notes = the curated CHANGELOG.md section for this
            # version (nx release wrote it); auto notes are the fallback.
            awk -v ver="${v#v}" '
              $0 ~ "^## " ver " " { inSec=1; print; next }
              inSec && /^## / { exit }
              inSec { print }
            ' CHANGELOG.md > /tmp/relnotes.md || true
            if [ -s /tmp/relnotes.md ]; then
              gh release create "v$v" --title "v$v" --notes-file /tmp/relnotes.md
            else
              gh release create "v$v" --title "v$v" --generate-notes
            fi
          fi
          # Dispatch on main so the *latest* publish.yml runs — the tag
          # only selects which ref gets checked out and published.
          gh workflow run publish.yml --ref main -f "tag=v$v"
